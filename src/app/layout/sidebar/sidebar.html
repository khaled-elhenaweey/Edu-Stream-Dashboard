<div class="flex flex-col h-full">
  <div class="p-6 border-b border-white/5">
    <a routerLink="/dashboard" class="flex items-center gap-2 text-white font-bold text-lg hover:text-blue-400 transition-colors">
      <span class="w-9 h-9 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">E</span>
      Edu-Stream
    </a>
  </div>
  <nav class="flex-1 p-4 space-y-1">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-white/5 text-blue-400 border-blue-500/30"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>
      Dashboard
    </a>
    <a
      routerLink="/add-course"
      routerLinkActive="bg-white/5 text-blue-400 border-blue-500/30"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      Add course
    </a>
  </nav>
</div>
