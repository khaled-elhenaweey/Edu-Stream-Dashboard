<div
  class="group relative bg-white/3 backdrop-blur-xl border border-white/10 rounded-3xl p-5 transition-all duration-500 hover:bg-white/6 hover:-translate-y-2 hover:shadow-[0_20px_50px_rgba(8,_112,_184,_0.1)]">

  <div class="relative h-44 w-full mb-5 overflow-hidden rounded-2xl">
    <img [src]="course.imageUrl" [alt]="course.title"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
    <span
      class="absolute top-3 right-3 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30 backdrop-blur-md">
      {{course.status}}
    </span>
    <button (click)="requestDelete()"
      class="absolute top-3 left-3 p-2 rounded-xl bg-red-500/10 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-500 hover:text-white border border-red-500/20">

      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-start">
      <h3 class="text-lg font-semibold text-white/90 leading-tight group-hover:text-blue-400 transition-colors">
        {{course.title}}
      </h3>
    </div>

    <p class="text-sm text-white/50">{{course.instructor}}</p>

    <div class="py-2">
      <div class="flex justify-between mb-2 text-xs">
        <span class="text-white/40">Progress</span>
        <span class="text-blue-400 font-medium">{{course.progress}}%</span>
      </div>
      <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-full transition-all duration-1000"
          [style.width.%]="course.progress">
        </div>
      </div>
    </div>

    <div class="pt-2 flex items-center justify-between border-t border-white/5">
      <div class="text-xl font-bold text-white">${{course.price}}</div>
      <div class="flex items-center gap-1 text-yellow-500/90 text-sm font-medium">
        <span>⭐</span>
        <span>{{ course.rating }}</span>
      </div>
    </div>

  </div>
</div>
