<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
  <div class="bg-[#1e293b] border border-white/10 rounded-3xl w-full max-w-lg p-8 shadow-2xl relative">
    <button (click)="close()" class="absolute top-4 right-4 text-white/30 hover:text-white">✕</button>
    <div class="mb-4">
      <ng-content select="[modal-header]"></ng-content>
    </div>
    <div class="text-white/60 mb-8">
      <ng-content select="[modal-body]"></ng-content>
    </div>
    <div class="flex justify-end gap-4">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
</div>
